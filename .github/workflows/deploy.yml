name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/av-diagram-generator-DvBJA
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /APPBE/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-functions:
    runs-on: ubuntu-latest
    # Ne déployer les fonctions que si les secrets Supabase sont configurés
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Functions
        run: |
          # Déploie une fonction avec jusqu'à 3 tentatives (résiste aux hoquets
          # réseau / API Supabase qui faisaient échouer le job sans raison de fond).
          deploy() {
            fn="$1"
            attempt=1
            max=3
            until supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Échec du déploiement de $fn après $max tentatives"
                return 1
              fi
              echo "Tentative $attempt/$max pour $fn échouée — nouvel essai dans 10 s…"
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "✓ $fn déployée"
          }
          deploy admin-update-user
          deploy invite-user
          deploy notify-admin-new-user
          deploy complete-product
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
